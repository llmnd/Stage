{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Nouvelle annonce</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded shadow">
    <h1 class="text-2xl font-bold mb-4">📢 Nouvelle annonce</h1>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}
      
      {{ form.non_field_errors }}

      <div>
        <label for="{{ form.titre.id_for_label }}" class="block text-sm font-medium text-gray-700">Titre</label>
        {{ form.titre }}
        {{ form.titre.errors }}
      </div>

      <div>
        <label for="{{ form.contenu.id_for_label }}" class="block text-sm font-medium text-gray-700">Contenu</label>
        {{ form.contenu }}
        {{ form.contenu.errors }}
      </div>

      <div>
        <label for="{{ form.fichier.id_for_label }}" class="block text-sm font-medium text-gray-700">Fichier (optionnel)</label>
        {{ form.fichier }}
        {{ form.fichier.errors }}
      </div>

      <div class="pt-4">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Publier l’annonce
        </button>
        
      </div>
    </form>
  </div>

</body>
</html>
