{% extends "base.html" %}
{% load static %}
{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
  
  .thesis-container {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem;
  }
  
  .thesis-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 600px;
    padding: 2.5rem;
    transform: translateY(0);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
    position: relative;
  }
  
  .thesis-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  }
  
  .thesis-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 8px;
    background: linear-gradient(90deg, #8b5cf6 0%, #6366f1 100%);
  }
  
  .thesis-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  
  .thesis-header h2 {
    color: #2d3748;
    font-weight: 600;
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
  }
  
  .form-group {
    margin-bottom: 1.5rem;
    position: relative;
  }
  
  .form-group label {
    display: block;
    color: #4a5568;
    font-size: 0.95rem;
    margin-bottom: 0.75rem;
    font-weight: 500;
  }
  
  .form-control {
    width: 100%;
    padding: 0.875rem 1.25rem;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    background-color: #f8fafc;
  }
  
  .form-control:focus {
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    background-color: white;
    outline: none;
  }
  
  /* Style spécifique pour le champ fichier */
  .file-input {
    padding: 0.5rem;
  }
  
  .error-message {
    color: #ef4444;
    font-size: 0.85rem;
    margin-top: 0.5rem;
    display: block;
  }
  
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 1rem 1.75rem;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
    color: white;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }
  
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
    background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
  }
  
  .btn-outline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 1rem 1.75rem;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    background: white;
    color: #4a5568;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-left: 1rem;
  }
  
  .btn-outline:hover {
    border-color: #cbd5e0;
    background: #f7fafc;
    transform: translateY(-3px);
  }
  
  .button-group {
    display: flex;
    justify-content: center;
    margin-top: 2.5rem;
  }
  
  /* Animation pour les champs */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .form-group {
    animation: fadeIn 0.6s ease forwards;
    opacity: 0;
  }
  
  .form-group:nth-child(1) { animation-delay: 0.1s; }
  .form-group:nth-child(2) { animation-delay: 0.2s; }
  .form-group:nth-child(3) { animation-delay: 0.3s; }
  .form-group:nth-child(4) { animation-delay: 0.4s; }
  .form-group:nth-child(5) { animation-delay: 0.5s; }
  
  /* Style pour les icônes */
  .btn-primary i,
  .btn-outline i {
    margin-right: 0.75rem;
    width: 1.1rem;
    height: 1.1rem;
  }
</style>

<div class="thesis-container">
  <div class="thesis-card">
    <div class="thesis-header">
      <h2>Déposer un mémoire / rapport</h2>
    </div>
    
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <span class="error-message">{{ field.errors.0 }}</span>
          {% endif %}
          {% if field.help_text %}
            <p class="text-gray-500 text-sm mt-2">{{ field.help_text }}</p>
          {% endif %}
        </div>
      {% endfor %}

      <div class="button-group">
        <button type="submit" class="btn-primary">
          <i data-lucide="upload"></i> Déposer
        </button>
        <a href="{% url 'etudiant_dashboard' %}" class="btn-outline">
          Annuler
        </a>
      </div>
    </form>
  </div>
</div>

<script>
  // Ajoute une classe 'filled' aux champs qui ont du contenu
  document.querySelectorAll('.form-control').forEach(input => {
    input.addEventListener('input', function() {
      if (this.value) {
        this.classList.add('filled');
      } else {
        this.classList.remove('filled');
      }
    });
    
    // Vérifie au chargement si le champ est pré-rempli
    if (input.value) {
      input.classList.add('filled');
    }
  });

  // Initialise les icônes Lucide
  if (window.lucide) {
    lucide.createIcons();
  }
</script>
{% endblock %}
