<!-- Modal de partage -->
<div class="modal fade" id="shareModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-custom">
            <div class="modal-header modal-header-custom">
                <h5 class="modal-title modal-title-custom">
                    <i data-lucide="share-2" class="me-2"></i>
                    Partager ce mémoire
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-4">
                    <label class="form-label">Lien de partage</label>
                    <div class="input-group">
                        <input type="text" class="form-control" value="{{ request.build_absolute_uri }}" id="shareLink" readonly>
                        <button class="btn btn-primary" onclick="copyShareLink()">
                            <i data-lucide="copy" class="me-1"></i> Copier
                        </button>
                    </div>
                </div>
                
                <div class="form-check form-switch mt-4">
                    <input class="form-check-input" type="checkbox" id="publicSwitch" {% if memoire.est_public %}checked{% endif %}>
                    <label class="form-check-label" for="publicSwitch">
                        <strong>Rendre ce mémoire public</strong>
                        <small class="d-block text-muted">Tous les utilisateurs pourront voir ce mémoire</small>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fermer</button>
                <button type="button" class="btn btn-primary">Enregistrer</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal de suppression -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-custom">
            <div class="modal-header modal-header-custom">
                <div class="bg-danger bg-opacity-10 rounded-circle p-2 me-3">
                    <i data-lucide="alert-triangle" class="text-danger"></i>
                </div>
                <h5 class="modal-title modal-title-custom">Confirmer la suppression</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Vous êtes sur le point de supprimer définitivement ce mémoire :</p>
                <div class="alert alert-light border mt-3">
                    <h6 class="mb-0 fw-bold">{{ memoire.titre }}</h6>
                    <small class="text-muted">Par {{ memoire.etudiant }} - Déposé le {{ memoire.date_depot|date:"d/m/Y" }}</small>
                </div>
                <p class="mt-3 text-danger">Cette action est irréversible. Voulez-vous vraiment continuer ?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                <form method="post" action="{% url 'supprimer_memoire' memoire.id %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i data-lucide="trash-2" class="me-1"></i> Supprimer définitivement
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
