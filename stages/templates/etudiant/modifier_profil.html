{% extends "base.html" %}
{% load static %}
{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
  
  .profile-container {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem;
  }
  
  .profile-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 600px;
    padding: 2.5rem;
    transform: translateY(0);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
    position: relative;
  }
  
  .profile-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  }
  
  .profile-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 8px;
    background: linear-gradient(90deg, #10b981 0%, #3b82f6 100%);
  }
  
  .profile-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  
  .profile-header h2 {
    color: #111827;
    font-weight: 600;
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
  }
  
  .form-group {
    margin-bottom: 1.5rem;
    position: relative;
  }
  
  .form-group label {
    display: block;
    color: #374151;
    font-size: 0.9rem;
    margin-bottom: 0.5rem;
    font-weight: 500;
  }
  
  .form-control {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    background-color: #f9fafb;
  }
  
  .form-control:focus {
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    background-color: white;
    outline: none;
  }
  
  .error-message {
    color: #ef4444;
    font-size: 0.8rem;
    margin-top: 0.25rem;
    display: block;
  }
  
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.875rem 1.5rem;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
    color: white;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }
  
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 14px rgba(0, 0, 0, 0.15);
    background: linear-gradient(135deg, #0d9e6e 0%, #2563eb 100%);
  }
  
  .btn-outline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.875rem 1.5rem;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    background: white;
    color: #374151;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-left: 0.5rem;
  }
  
  .btn-outline:hover {
    border-color: #d1d5db;
    background: #f9fafb;
    transform: translateY(-2px);
  }
  
  .button-group {
    display: flex;
    justify-content: flex-end;
    margin-top: 2rem;
  }
  
  /* Animation pour les champs */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .form-group {
    animation: fadeIn 0.5s ease forwards;
    opacity: 0;
  }
  
  .form-group:nth-child(1) { animation-delay: 0.1s; }
  .form-group:nth-child(2) { animation-delay: 0.2s; }
  .form-group:nth-child(3) { animation-delay: 0.3s; }
  .form-group:nth-child(4) { animation-delay: 0.4s; }
  .form-group:nth-child(5) { animation-delay: 0.5s; }
</style>

<div class="profile-container">
  <div class="profile-card">
    <div class="profile-header">
      <h2>Modifier mon profil</h2>
    </div>
    
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <span class="error-message">{{ field.errors.0 }}</span>
          {% endif %}
        </div>
      {% endfor %}

      <div class="button-group">
        <button type="submit" class="btn-primary">
          <i data-lucide="save" class="mr-2"></i> Enregistrer
        </button>
        <a href="{% url 'dashboard' %}" class="btn-outline">
          Annuler
        </a>
      </div>
    </form>
  </div>
</div>

<script>
  // Ajoute une classe 'filled' aux champs qui ont du contenu
  document.querySelectorAll('.form-control').forEach(input => {
    input.addEventListener('input', function() {
      if (this.value) {
        this.classList.add('filled');
      } else {
        this.classList.remove('filled');
      }
    });
    
    // Vérifie au chargement si le champ est pré-rempli
    if (input.value) {
      input.classList.add('filled');
    }
  });

  // Initialise les icônes Lucide (assurez-vous d'avoir importé la bibliothèque)
  if (window.lucide) {
    lucide.createIcons();
  }
</script>
{% endblock %}
