{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
  
  .company-profile-container {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f0f4f8 0%, #dfe7ef 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem;
  }
  
  .company-profile-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 700px;
    padding: 2.5rem;
    transform: translateY(0);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
    position: relative;
  }
  
  .company-profile-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  }
  
  .company-profile-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 8px;
    background: linear-gradient(90deg, #2563eb 0%, #1e40af 100%);
  }
  
  .company-profile-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  
  .company-profile-header h2 {
    color: #111827;
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 0.5rem;
  }
  
  .form-group {
    margin-bottom: 1.75rem;
    position: relative;
  }
  
  .form-group label {
    display: block;
    color: #374151;
    font-size: 0.95rem;
    margin-bottom: 0.75rem;
    font-weight: 600;
  }
  
  .form-control {
    width: 100%;
    padding: 0.875rem 1.25rem;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background-color: #f9fafb;
  }
  
  .form-control:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    background-color: white;
    outline: none;
  }
  
  .error-message {
    color: #dc2626;
    font-size: 0.85rem;
    margin-top: 0.5rem;
    display: block;
  }
  
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 1rem 2rem;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
    color: white;
    font-weight: 600;
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-top: 1.5rem;
  }
  
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 100%);
  }
  
  .btn-primary i {
    margin-right: 0.75rem;
    width: 1.25rem;
    height: 1.25rem;
  }
  
  /* Animation pour les champs */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .form-group {
    animation: fadeIn 0.6s ease forwards;
    opacity: 0;
  }
  
  .form-group:nth-child(1) { animation-delay: 0.1s; }
  .form-group:nth-child(2) { animation-delay: 0.2s; }
  .form-group:nth-child(3) { animation-delay: 0.3s; }
  .form-group:nth-child(4) { animation-delay: 0.4s; }
  .form-group:nth-child(5) { animation-delay: 0.5s; }
  .form-group:nth-child(6) { animation-delay: 0.6s; }
</style>

<div class="company-profile-container">
  <div class="company-profile-card">
    <div class="company-profile-header">
      <h2>Modifier mon profil entreprise</h2>
    </div>
    
    <form method="post" enctype="multipart/form-data" class="space-y-6">
      {% csrf_token %}
      
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <span class="error-message">{{ field.errors.0 }}</span>
          {% endif %}
          {% if field.help_text %}
            <p class="text-gray-500 text-sm mt-1">{{ field.help_text }}</p>
          {% endif %}
        </div>
      {% endfor %}

      <div class="text-center">
        <button type="submit" class="btn-primary">
          <i data-lucide="save"></i> Enregistrer les modifications
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  // Ajoute une classe 'filled' aux champs qui ont du contenu
  document.querySelectorAll('.form-control').forEach(input => {
    input.addEventListener('input', function() {
      if (this.value) {
        this.classList.add('filled');
      } else {
        this.classList.remove('filled');
      }
    });
    
    // Vérifie au chargement si le champ est pré-rempli
    if (input.value) {
      input.classList.add('filled');
    }
  });

  // Initialise les icônes Lucide
  if (window.lucide) {
    lucide.createIcons();
  }
</script>
{% endblock %}
